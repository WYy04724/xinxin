<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小可爱专属页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "微软雅黑", sans-serif;
            background: #ffeff5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .title {
            font-size: 26px;
            color: #ff7a9c;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .subtitle {
            font-size: 16px;
            color: #ff9ebb;
            margin-bottom: 30px;
        }

        .heart-box {
            position: relative;
            width: 100%;
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .big-heart {
            font-size: 100px;
            animation: jump 1.2s infinite alternate;
        }

        @keyframes jump {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); }
        }

        .btn {
            background: #ff9ebb;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 18px;
            margin-top: 20px;
            cursor: pointer;
            box-shadow: 0 5px 15px #ffc8dd;
            transition: 0.3s;
        }

        .btn:hover {
            background: #ff7a9c;
            transform: scale(1.05);
        }

        .msg {
            margin-top: 25px;
            font-size: 17px;
            color: #ff6b8b;
            opacity: 0;
            transition: 0.6s;
        }

        .show {
            opacity: 1 !important;
        }

        /* 点击冒爱心 */
        .float-heart {
            position: absolute;
            pointer-events: none;
            animation: floatUp 1.5s linear forwards;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0);
            }
            100% {
                opacity: 0;
                transform: translateY(-200px);
            }
        }
    </style>
</head>

<body>

    <div class="title">你是全世界最可爱的小朋友 ✨</div>
    <div class="subtitle">看到你开心，我就超开心啦</div>

    <div class="heart-box">
        <div class="big-heart">❤️</div>
    </div>

    <button class="btn" onclick="showMsg()">点我一下</button>
    <div class="msg" id="msg">只要你开心，感觉整个世界都变甜啦 😊</div>

    <script>
        // 点击屏幕冒爱心
        document.addEventListener('click', function(e) {
            let heart = document.createElement('div');
            heart.innerHTML = '❤️';
            heart.className = 'float-heart';
            heart.style.left = e.clientX - 15 + 'px';
            heart.style.top = e.clientY - 15 + 'px';
            heart.style.fontSize = Math.random() * 15 + 15 + 'px';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 1500);
        });

        function showMsg() {
            let msg = document.getElementById('msg');
            msg.classList.add('show');
        }
    </script>

</body>
</html>
