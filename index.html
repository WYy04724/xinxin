<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <!-- GA4 跟踪代码（直接替换成你的ID即可） -->

        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>给小可爱的专属甜份💖</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #ffe6f2 0%, #fff0f5 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* 背景漂浮爱心 */
        .bg-heart {
            position: absolute;
            font-size: 24px;
            opacity: 0.3;
            animation: float 6s infinite ease-in-out;
            z-index: 0;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(180deg); }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 500px;
            width: 100%;
        }

        .title {
            font-size: 28px;
            color: #ff69b4;
            margin-bottom: 15px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(255,105,180,0.2);
        }

        .subtitle {
            font-size: 18px;
            color: #ff8fab;
            margin-bottom: 40px;
        }

        .cat-img {
            width: 200px;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(255,105,180,0.3);
            margin-bottom: 30px;
            animation: shake 3s infinite alternate;
        }

        @keyframes shake {
            0% { transform: rotate(-3deg); }
            100% { transform: rotate(3deg); }
        }

        .btn-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .btn {
            background: linear-gradient(45deg, #ff9a9e 0%, #fad0c4 100%);
            color: white;
            border: none;
            padding: 14px 35px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255,154,158,0.4);
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 20px rgba(255,154,158,0.5);
        }

        .msg-box {
            margin-top: 30px;
            min-height: 60px;
            font-size: 20px;
            color: #ff4d94;
            opacity: 0;
            transition: opacity 0.8s ease;
            font-weight: 500;
        }

        .msg-show {
            opacity: 1 !important;
        }

        /* 点击全屏爱心爆炸 */
        .explode-heart {
            position: absolute;
            pointer-events: none;
            animation: explode 1.5s linear forwards;
            z-index: 2;
        }

        @keyframes explode {
            0% {
                opacity: 1;
                transform: scale(0) translate(0, 0);
            }
            50% {
                opacity: 1;
                transform: scale(1) translate(var(--x), var(--y));
            }
            100% {
                opacity: 0;
                transform: scale(0.5) translate(calc(var(--x) * 1.5), calc(var(--y) * 1.5));
            }
        }
    </style>
</head>
<body>
    <!-- 背景漂浮爱心 -->
    <div class="bg-heart" style="left: 10%; top: 15%;">💖</div>
    <div class="bg-heart" style="left: 80%; top: 20%;">💕</div>
    <div class="bg-heart" style="left: 20%; top: 80%;">💗</div>
    <div class="bg-heart" style="left: 75%; top: 75%;">💓</div>
    <div class="bg-heart" style="left: 50%; top: 10%;">💞</div>

    <div class="container">
        <div class="title">我的全世界最可爱的小朋友✨</div>
        <div class="subtitle">今天也要开开心心，快快乐乐呀🥰</div>
        
        <!-- 替换成你自己的猫咪/可爱图片 -->
        <img src="mao.jpg" alt="超可爱猫咪" class="cat-img">

        <div class="btn-group">
            <button class="btn" onclick="showMsg('你是人间小甜豆，永远被爱包围💖')">夸夸你</button>
            <button class="btn" onclick="showMsg('要一直做无忧无虑的小朋友呀🥳')">祝福你</button>
            <button class="btn" onclick="explodeHearts()">满屏爱心</button>
        </div>

        <div class="msg-box" id="msgBox"></div>
    </div>

    <script>
        // 显示暖心文案
        function showMsg(text) {
            const msgBox = document.getElementById('msgBox');
            msgBox.textContent = text;
            msgBox.classList.add('msg-show');
            setTimeout(() => {
                msgBox.classList.remove('msg-show');
            }, 3000);
        }

        // 点击屏幕爱心爆炸
        document.addEventListener('click', function(e) {
            // 生成8个爱心
            for(let i = 0; i < 8; i++) {
                const heart = document.createElement('div');
                heart.innerHTML = ['💖','💕','💗','💓','💞'][Math.floor(Math.random()*5)];
                heart.className = 'explode-heart';
                heart.style.left = e.clientX + 'px';
                heart.style.top = e.clientY + 'px';
                // 随机方向
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 150 + 50;
                heart.style.setProperty('--x', Math.cos(angle) * distance + 'px');
                heart.style.setProperty('--y', Math.sin(angle) * distance + 'px');
                heart.style.fontSize = (Math.random() * 20 + 16) + 'px';
                document.body.appendChild(heart);

                setTimeout(() => heart.remove(), 1500);
            }
        });

        // 满屏爱心按钮
        function explodeHearts() {
            // 触发全屏爱心雨
            for(let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.innerHTML = ['💖','💕','💗','💓','💞'][Math.floor(Math.random()*5)];
                    heart.className = 'explode-heart';
                    const x = Math.random() * window.innerWidth;
                    const y = window.innerHeight / 2;
                    heart.style.left = x + 'px';
                    heart.style.top = y + 'px';
                    const angle = Math.random() * Math.PI * 2;
                    const distance = Math.random() * 200 + 100;
                    heart.style.setProperty('--x', Math.cos(angle) * distance + 'px');
                    heart.style.setProperty('--y', Math.sin(angle) * distance + 'px');
                    heart.style.fontSize = (Math.random() * 25 + 20) + 'px';
                    document.body.appendChild(heart);
                    setTimeout(() => heart.remove(), 1500);
                }, i * 30);
            }
            showMsg('满屏的爱都给你🥰');
        }
    </script>
</body>
</html>
